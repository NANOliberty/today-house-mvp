name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: todayhouse
          POSTGRES_PASSWORD: todayhouse123
          POSTGRES_DB: todayhouse_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U todayhouse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://todayhouse:todayhouse123@localhost:5432/todayhouse_test
      JWT_SECRET: ci-secret
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run test:ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx next lint --max-warnings=0 || true   # lint 는 경고만, 실패시키지 않음
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5001/api

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t todayhouse-backend ./backend
