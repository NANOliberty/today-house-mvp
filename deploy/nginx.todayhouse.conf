# /etc/nginx/sites-available/todayhouse  →  sites-enabled 에 심볼릭 링크
# 인증서는 certbot --nginx 로 발급 (Let's Encrypt)

server {
    listen 80;
    server_name todayhouseee.duckdns.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name todayhouseee.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/todayhouseee.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todayhouseee.duckdns.org/privkey.pem;

    client_max_body_size 10m;

    # 백엔드 API
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 업로드 이미지
    location /uploads/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
    }

    # 메트릭·관리 포트는 외부 차단 (Tailscale/내부망에서만 접근)
    location /metrics { return 404; }

    # 프론트엔드 (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
