server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker 컨테이너 stdout/stderr 를 전부 수집, 컨테이너 이름을 라벨로
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      # 백엔드 pino JSON 로그에서 level/status 를 라벨로 뽑는다
      - match:
          selector: '{service="backend"}'
          stages:
            - json:
                expressions:
                  level: level
                  status: status
                  requestId: requestId
            - labels:
                level:

  # 홈서버에서는 백엔드가 PM2 로 돌아 Docker 로그가 없다 → PM2 로그 파일을 직접 읽는다
  - job_name: pm2
    static_configs:
      - targets: [localhost]
        labels:
          service: backend
          source: pm2
          __path__: /host-pm2-logs/todayhouse-backend-out*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
      - labels:
          level:
