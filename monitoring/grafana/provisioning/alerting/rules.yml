apiVersion: 1
groups:
  - orgId: 1
    name: todayhouse
    folder: alerts
    interval: 1m
    rules:
      - uid: backend-down
        title: 백엔드 다운
        condition: C
        for: 2m
        noDataState: Alerting   # 백엔드 다운은 데이터 없음 자체가 장애
        execErrState: Error
        labels: { severity: critical }
        annotations:
          summary: "todayhouse-backend 가 2분 이상 응답하지 않음 (Prometheus up=0)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: 'up{job="backend"}', refId: A }
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [1] } }]
              refId: C

      - uid: high-5xx-rate
        title: 5xx 비율 5% 초과
        condition: C
        for: 5m
        noDataState: OK         # 5xx 가 0건이면 정상
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "최근 5분 5xx 응답 비율이 5% 를 넘음"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: '(sum(rate(todayhouse_http_requests_total{status_code=~"5.."}[5m])) or vector(0)) / clamp_min(sum(rate(todayhouse_http_requests_total[5m])), 0.001)'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]
              refId: C

      - uid: host-disk-low
        title: 디스크 여유 10% 미만
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning }
        annotations:
          summary: "루트 파일시스템 여유 공간 10% 미만"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'min(node_filesystem_avail_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"}) / min(node_filesystem_size_bytes{mountpoint="/",fstype!~"tmpfs|overlay|squashfs"})'
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions: [{ evaluator: { type: lt, params: [0.10] } }]
              refId: C
