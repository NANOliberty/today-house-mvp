apiVersion: 1
groups:
  - orgId: 1
    name: todayhouse
    folder: alerts
    interval: 1m
    rules:
      - uid: backend-down
        title: 백엔드 다운
        condition: C
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "todayhouse-backend 가 2분 이상 응답하지 않음 (Prometheus up=0)"
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: prometheus
            model: { expr: 'up{job="backend"}', refId: A }
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [1] } }]
              refId: C

      - uid: high-5xx-rate
        title: 5xx 비율 5% 초과
        condition: C
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "최근 5분 5xx 응답 비율이 5% 를 넘음"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'sum(rate(todayhouse_http_requests_total{status_code=~"5.."}[5m])) / clamp_min(sum(rate(todayhouse_http_requests_total[5m])), 0.001)'
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]
              refId: C

      - uid: host-disk-low
        title: 디스크 여유 10% 미만
        condition: C
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "루트 파일시스템 여유 공간 10% 미만"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              expr: 'node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}'
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: lt, params: [0.10] } }]
              refId: C
